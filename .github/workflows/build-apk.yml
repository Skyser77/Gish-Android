
name: Build Gish APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and build
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          mkdir project
          unzip "$ZIP" -d project

          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found in archive"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          cd "$ROOT"

          sed -i 's/VERSION_8/VERSION_1_8/g' app/build.gradle

          echo "android.useAndroidX=true" >> gradle.properties

          mkdir -p app/src/main/res/mipmap-anydpi

          cat > app/src/main/res/mipmap-anydpi/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <path android:fillColor="#173B2A"
                  android:pathData="M0,0h100v100h-100z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M50,15 A35,35 0,1 0,85 50 L85,43 L53,43 L53,56 L70,56 A22,22 0,1 1,70 35 L80,26 A35,35 0,0 0,50 15 Z"/>
          </vector>
          EOF

          cp app/src/main/res/mipmap-anydpi/ic_launcher.xml app/src/main/res/mipmap-anydpi/ic_launcher_round.xml

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Android-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
