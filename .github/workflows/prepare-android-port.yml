
name: Prepare Gish Android Port Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate original game
        run: |
          JAR=$(find . -maxdepth 1 -type f -iname '*.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo "Original Gish JAR not found"
            exit 1
          fi
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          echo "Found original game: $JAR"

      - name: Download CFR decompiler
        run: |
          curl -fL https://www.benf.org/other/cfr/cfr-0.152.jar \
            -o "$RUNNER_TEMP/cfr.jar"

      - name: Extract original game and decompile
        run: |
          mkdir -p porting/generated/source
          mkdir -p porting/generated/original

          unzip -q "$JAR" -d porting/generated/original

          java -jar "$RUNNER_TEMP/cfr.jar" "$JAR" \
            --outputdir porting/generated/source \
            --silent true \
            --renamedupmembers true \
            > porting/generated/cfr.log 2>&1 || true

          find porting/generated/source -type f -name '*.java' \
            | sort > porting/generated/java-files.txt

          find porting/generated/original -type f \
            | sort > porting/generated/all-original-files.txt

      - name: Analyze Java ME dependencies
        run: |
          grep -RhoE '^import [^;]+' porting/generated/source \
            --include='*.java' \
            | sort -u > porting/generated/imports.txt || true

          grep -RhoE 'javax\.microedition\.[A-Za-z0-9_.]+' \
            porting/generated/source \
            --include='*.java' \
            | sort -u > porting/generated/j2me-apis.txt || true

          echo "Java source files:"
          wc -l porting/generated/java-files.txt

          echo "Original game files:"
          wc -l porting/generated/all-original-files.txt

      - name: Create source report
        run: |
          cat > porting/generated/REPORT.md <<'EOF'
          # Gish Android Port — Source Analysis

          This directory contains files extracted from the original Gish JAR.

          - source/: CFR-decompiled Java source
          - original/: original JAR contents, including game resources
          - imports.txt: Java imports used by the game
          - j2me-apis.txt: detected Java ME API references
          - cfr.log: decompiler output

          This is source preparation, not yet a completed Android port.
          EOF

      - name: Save generated sources to dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin android-port-source >/dev/null 2>&1; then
            git fetch origin android-port-source
            git checkout -B android-port-source origin/android-port-source
          else
            git checkout -B android-port-source
          fi

          git add porting/generated

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Prepare original Gish sources for Android port"
            git push origin HEAD:android-port-source
          fi

      - name: Upload backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Android-Port-Sources
          path: porting/generated/
          if-no-files-found: warn
