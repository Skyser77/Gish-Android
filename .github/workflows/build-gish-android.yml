name: Build Gish Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout prepared Gish source
        uses: actions/checkout@v4
        with:
          ref: android-port-source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download J2ME Loader runtime
        run: git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime

      - name: Integrate original Gish source and resources
        shell: bash
        run: |
          set -euxo pipefail
          test -d porting/generated/source
          test -d porting/generated/original
          mkdir -p runtime/app/src/midlet/java/com/hardwire/blob
          mkdir -p runtime/app/src/midlet/resources
          python3 - <<'PY'
          from pathlib import Path
          src = Path("porting/generated/source")
          dst = Path("runtime/app/src/midlet/java/com/hardwire/blob")
          files = sorted(src.glob("*.java"))
          if not files:
              raise SystemExit("No decompiled Java files found")
          for f in files:
              text = f.read_text(encoding="utf-8", errors="replace")
              if not any(line.lstrip().startswith("package ") for line in text.splitlines()):
                  text = "package com.hardwire.blob;\\n\\n" + text
              (dst / f.name).write_text(text, encoding="utf-8")
          print(f"Integrated {len(files)} original Java source files")
          PY
          cp -a porting/generated/original/. runtime/app/src/midlet/resources/
          mkdir -p runtime/app/src/midlet/resources/MIDLET-META-INF
          cat > runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF <<'EOF'
          Manifest-Version: 1.0
          MIDlet-1: Gish, , com.hardwire.blob.Main
          MIDlet-Name: Gish
          MIDlet-Vendor: Original game source port
          MIDlet-Version: 1.3.3
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          EOF
          cat > runtime/app/src/midlet/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application>
                  <activity android:name=".MainActivity" tools:node="remove" />
                  <activity android:name="javax.microedition.shell.MicroActivity"
                      android:exported="true"
                      tools:remove="android:process"
                      tools:replace="android:exported">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <activity android:name=".settings.SettingsActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.APPLICATION_PREFERENCES" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          echo "Integrated Java files: $(find runtime/app/src/midlet/java -name '*.java' | wc -l)"
          echo "Integrated resource files: $(find runtime/app/src/midlet/resources -type f | wc -l)"

      - name: Build standalone Gish APK
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleMidletDebug

      - name: Upload APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Android-APK-and-build-logs
          path: |
            runtime/app/build/outputs/apk/midlet/debug/*.apk
            runtime/app/build/reports/
            runtime/app/build/outputs/logs/
          if-no-files-found: warn
