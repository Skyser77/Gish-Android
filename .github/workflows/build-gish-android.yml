
name: Build Gish Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build original Gish for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gish source
        uses: actions/checkout@v4
        with:
          ref: android-port-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Clone J2ME Loader runtime
        run: |
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime

      - name: Prepare original Gish sources and resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re
          import sys

          root = Path.cwd()
          source = root / "porting/generated/source"
          original = root / "porting/generated/original"
          target = root / "runtime/app/src/midlet"
          java_target = target / "java/com/hardwire/blob"
          resources_target = target / "resources"

          if not source.exists():
              sys.exit("ERROR: Decompiled Java source directory not found")

          if not original.exists():
              sys.exit("ERROR: Original game resources directory not found")

          java_files = list(source.rglob("*.java"))

          if not java_files:
              sys.exit("ERROR: No Java source files found")

          java_target.mkdir(parents=True, exist_ok=True)
          resources_target.mkdir(parents=True, exist_ok=True)

          copied = 0

          for file in java_files:
              content = file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if not re.search(r'(?m)^\s*package\s+', content):
                  content = "package com.hardwire.blob;\n\n" + content

              destination = java_target / file.name
              destination.write_text(content, encoding="utf-8")
              copied += 1

          shutil.copytree(
              original,
              resources_target,
              dirs_exist_ok=True
          )

          manifest_dir = resources_target / "MIDLET-META-INF"
          manifest_dir.mkdir(parents=True, exist_ok=True)

          manifest = """Manifest-Version: 1.0
          MIDlet-1: Gish, , com.hardwire.blob.Main
          MIDlet-Name: Gish
          MIDlet-Vendor: Original game source port
          MIDlet-Version: 1.3.3
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          """

          (manifest_dir / "MANIFEST.MF").write_text(
              manifest,
              encoding="utf-8"
          )

          android_manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Gish"
                  android:hasCode="true">
                  <activity
                      android:name="javax.microedition.shell.MicroActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          (target / "AndroidManifest.xml").write_text(
              android_manifest,
              encoding="utf-8"
          )

          print(f"Java files copied: {copied}")
          print("Original game resources copied")
          print("MIDlet manifest created")
          print("Android launcher manifest created")
          PY

      - name: Build Gish APK
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleMidletDebug

      - name: Upload APK and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Android-APK-and-build-logs
          path: |
            runtime/app/build/outputs/apk/**/*.apk
            runtime/app/build/reports/**
            runtime/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14
