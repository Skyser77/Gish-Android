
name: Build Gish Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Gish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gish source
        uses: actions/checkout@v4
        with:
          ref: android-port-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Download Vineflower
        run: |
          curl -fL \
            https://repo1.maven.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar \
            -o vineflower.jar

      - name: Decompile original Gish
        run: |
          test -f Gish_V.1.3.3.jar
          rm -rf porting/vineflower-source
          mkdir -p porting/vineflower-source

          java -jar vineflower.jar \
            --folder \
            --skip-extra-files=1 \
            --rename-members=1 \
            Gish_V.1.3.3.jar \
            porting/vineflower-source

          COUNT=$(find porting/vineflower-source -name '*.java' | wc -l)
          echo "Java files: $COUNT"
          test "$COUNT" -gt 0

          if grep -R -n '\*\* GOTO' porting/vineflower-source --include='*.java'; then
            echo "Invalid decompiler output detected"
            exit 1
          fi

      - name: Clone J2ME Loader
        run: |
          git clone --depth 1 \
            https://github.com/nikita36078/J2ME-Loader.git runtime

      - name: Prepare Gish MIDlet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import re
          import sys

          root = Path.cwd()
          source = root / "porting/vineflower-source"
          original = root / "porting/generated/original"
          target = root / "runtime/app/src/midlet"
          java_target = target / "java/com/hardwire/blob"
          resources_target = target / "resources"

          if not source.is_dir():
              sys.exit("ERROR: Decompiled sources not found")

          if not original.is_dir():
              sys.exit("ERROR: Original game resources not found")

          java_files = sorted(source.rglob("*.java"))

          if not java_files:
              sys.exit("ERROR: No Java files found")

          java_target.mkdir(parents=True, exist_ok=True)
          resources_target.mkdir(parents=True, exist_ok=True)

          copied = 0
          used_names = set()

          for file in java_files:
              content = file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              if not re.search(r'(?m)^\s*package\s+', content):
                  content = (
                      "package com.hardwire.blob;\n\n"
                      + content
                  )

              destination = java_target / file.name

              if destination.name in used_names:
                  sys.exit(
                      "Duplicate Java filename: "
                      + destination.name
                  )

              used_names.add(destination.name)

              destination.write_text(
                  content,
                  encoding="utf-8"
              )

              copied += 1

          shutil.copytree(
              original,
              resources_target,
              dirs_exist_ok=True
          )

          manifest_dir = resources_target / "META-INF"
          manifest_dir.mkdir(parents=True, exist_ok=True)

          manifest = """Manifest-Version: 1.0
          MIDlet-1: Gish, , com.hardwire.blob.Main
          MIDlet-Name: Gish
          MIDlet-Vendor: Gish Android Port
          MIDlet-Version: 1.3.3
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          """

          (manifest_dir / "MANIFEST.MF").write_text(
              manifest,
              encoding="utf-8"
          )

          android_manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Gish"
                  android:hasCode="true">
                  <activity
                      android:name="javax.microedition.shell.MicroActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          (target / "AndroidManifest.xml").write_text(
              android_manifest,
              encoding="utf-8"
          )

          print("Prepared Java files:", copied)
          print("Original resources copied")
          print("MIDlet manifest created")
          print("Android manifest created")
          PY

      - name: Build APK
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleMidletDebug

      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Android-Build
          path: |
            runtime/app/build/outputs/apk/**/*.apk
            runtime/app/build/reports/**
            runtime/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14

