
name: Build Gish Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Gish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gish source
        uses: actions/checkout@v4
        with:
          ref: android-port-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Download Procyon decompiler
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 3 -fL \
            https://github.com/mstrobel/procyon/releases/download/v0.6.0/procyon-decompiler-0.6.0.jar \
            -o procyon.jar
          test -s procyon.jar

      - name: Decompile original Gish with Procyon
        run: |
          test -f Gish_V.1.3.3.jar
          rm -rf porting/procyon-source
          mkdir -p porting/procyon-source

          java -jar procyon.jar -jar Gish_V.1.3.3.jar -o porting/procyon-source

          COUNT=$(find porting/procyon-source -name '*.java' | wc -l)
          echo "Procyon Java files: $COUNT"
          test "$COUNT" -gt 0

          find porting/procyon-source -name '*.java' | sort | head -30

      - name: Clone J2ME Loader
        run: |
          git clone --depth 1 https://github.com/nikita36078/J2ME-Loader.git runtime

      - name: Prepare Gish MIDlet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import sys

          root = Path.cwd()
          source = root / "porting/procyon-source"
          original = root / "porting/generated/original"
          target = root / "runtime/app/src/midlet"
          java_root = target / "java"
          resources_target = target / "resources"

          if not source.is_dir() or not original.is_dir():
              sys.exit("Missing Procyon source or extracted original resources")

          java_files = sorted(source.rglob("*.java"))

          if not java_files:
              sys.exit("Procyon produced no Java source files")

          java_root.mkdir(parents=True, exist_ok=True)
          resources_target.mkdir(parents=True, exist_ok=True)

          seen = set()

          for file in java_files:
              code = file.read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              match = re.search(
                  r'(?m)^\s*package\s+([A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*)\s*;',
                  code
              )

              if match:
                  package = match.group(1)
                  dest_dir = java_root.joinpath(*package.split("."))
              else:
                  package = "com.hardwire.blob"
                  code = "package com.hardwire.blob;\n\n" + code
                  dest_dir = java_root / "com" / "hardwire" / "blob"

              dest_dir.mkdir(parents=True, exist_ok=True)
              dest = dest_dir / file.name
              key = str(dest.relative_to(java_root))

              if key in seen or dest.exists():
                  sys.exit("Duplicate Java source destination: " + key)

              seen.add(key)
              dest.write_text(code, encoding="utf-8")

          shutil.copytree(
              original,
              resources_target,
              dirs_exist_ok=True
          )

          manifest_dir = resources_target / "MIDLET-META-INF"
          manifest_dir.mkdir(parents=True, exist_ok=True)

          manifest = """Manifest-Version: 1.0
          MIDlet-1: Gish, , com.hardwire.blob.Main
          MIDlet-Name: Gish
          MIDlet-Vendor: Gish Android Port
          MIDlet-Version: 1.3.3
          MicroEdition-Configuration: CLDC-1.1
          MicroEdition-Profile: MIDP-2.0
          """

          (manifest_dir / "MANIFEST.MF").write_text(
              manifest,
              encoding="utf-8"
          )

          android_manifest = """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Gish"
                  android:hasCode="true">
                  <activity
                      android:name="javax.microedition.shell.MicroActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """

          (target / "AndroidManifest.xml").write_text(
              android_manifest,
              encoding="utf-8"
          )

          print("Prepared Java files:", len(seen))
          print("Original resources copied")
          print("MIDlet manifest installed at the correct path")
          PY

      - name: Build APK
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleMidletDebug

      - name: Upload APK, decompiled source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Android-Procyon-Diagnostics
          path: |
            runtime/app/build/outputs/apk/**/*.apk
            runtime/app/build/reports/**
            runtime/app/build/outputs/logs/**
            porting/procyon-source/**
            runtime/app/src/midlet/java/**
            runtime/app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          if-no-files-found: warn
          retention-days: 14

