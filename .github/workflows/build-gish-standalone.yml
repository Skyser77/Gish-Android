
name: Build Gish standalone APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Gish project
        uses: actions/checkout@v4

      - name: Verify original game JAR
        run: test -s Gish_V.1.3.3.jar

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Get J2ME Loader runtime with submodules
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/nikita36078/J2ME-Loader.git runtime
          test -s runtime/app/src/main/cpp/mmapi_tsf/TinySoundFont/tsf.h

      - name: Prepare standalone Gish launcher
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p runtime/app/src/main/assets
          cp Gish_V.1.3.3.jar runtime/app/src/main/assets/Gish_V.1.3.3.jar

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('runtime/app')
          gradle = root / 'build.gradle'
          text = gradle.read_text(encoding='utf-8')

          text, n1 = re.subn(
              r'applicationId\s+"ru\.playsoftware\.j2meloader"',
              'applicationId "com.skyser77.gish"',
              text,
              count=1
          )

          text, n2 = re.subn(
              r"resValue\s+'string',\s*'app_name',\s*rootProject\.name",
              "resValue 'string', 'app_name', 'Gish'",
              text,
              count=1
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit('Could not safely configure applicationId/app label')

          gradle.write_text(text, encoding='utf-8')

          launcher = r'''package ru.playsoftware.j2meloader;

          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.preference.PreferenceManager;
          import com.android.dx.command.dexer.Main;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.util.jar.JarFile;
          import ru.playsoftware.j2meloader.config.Config;
          import ru.playsoftware.j2meloader.config.ProfileModel;
          import ru.playsoftware.j2meloader.config.ProfilesManager;

          public final class MainActivity extends AppCompatActivity {
              private TextView status;

              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(32, 32, 32, 32);

                  ProgressBar progress = new ProgressBar(this);
                  status = new TextView(this);
                  status.setText("Preparing Gish for Android…");
                  status.setGravity(Gravity.CENTER);

                  layout.addView(progress);
                  layout.addView(status);
                  setContentView(layout);

                  new Thread(this::prepareAndLaunch, "GishInstaller").start();
              }

              private void prepareAndLaunch() {
                  try {
                      File work = new File(getExternalFilesDir(null), "GishData");

                      if (!work.exists() && !work.mkdirs()) {
                          throw new IllegalStateException("Cannot create game data directory");
                      }

                      PreferenceManager.getDefaultSharedPreferences(this)
                          .edit()
                          .putString("emulator_dir", work.getAbsolutePath())
                          .commit();

                      File appDir = new File(Config.getAppDir(), "gish");

                      if (!appDir.exists() && !appDir.mkdirs()) {
                          throw new IllegalStateException("Cannot create converted game directory");
                      }

                      File dex = new File(appDir.getAbsolutePath() + Config.MIDLET_DEX_FILE);
                      File res = new File(appDir.getAbsolutePath() + Config.MIDLET_RES_FILE);
                      File descriptor = new File(appDir.getAbsolutePath() + Config.MIDLET_MANIFEST_FILE);
                      File sourceJar = new File(getCacheDir(), "Gish_V.1.3.3.jar");

                      if (!sourceJar.isFile() || sourceJar.length() == 0) {
                          try (
                              InputStream in = getAssets().open("Gish_V.1.3.3.jar");
                              FileOutputStream out = new FileOutputStream(sourceJar)
                          ) {
                              byte[] buffer = new byte[16384];
                              int count;

                              while ((count = in.read(buffer)) != -1) {
                                  out.write(buffer, 0, count);
                              }
                          }
                      }

                      if (!dex.isFile() || dex.length() == 0 ||
                          !res.isFile() || !descriptor.isFile()) {

                          runOnUiThread(() ->
                              status.setText("Converting original Java ME game…")
                          );

                          dex.delete();

                          Main.main(new String[] {
                              "--no-optimize",
                              "--core-library",
                              "--output=" + dex.getAbsolutePath(),
                              sourceJar.getAbsolutePath()
                          });

                          if (!dex.isFile() || dex.length() == 0) {
                              throw new IllegalStateException(
                                  "J2ME bytecode conversion did not create DEX"
                              );
                          }

                          try (
                              FileOutputStream out = new FileOutputStream(res);
                              InputStream in = new java.io.FileInputStream(sourceJar)
                          ) {
                              byte[] buffer = new byte[16384];
                              int count;

                              while ((count = in.read(buffer)) != -1) {
                                  out.write(buffer, 0, count);
                              }
                          }

                          try (
                              JarFile jar = new JarFile(sourceJar);
                              FileOutputStream out = new FileOutputStream(descriptor)
                          ) {
                              if (jar.getManifest() == null) {
                                  throw new IllegalStateException(
                                      "Original JAR has no META-INF/MANIFEST.MF"
                                  );
                              }

                              jar.getManifest().write(out);
                          }
                      }

                      File configDir = new File(
                          Config.getEmulatorDir() +
                          Config.MIDLET_CONFIGS_DIR +
                          "gish"
                      );

                      if (!configDir.exists() && !configDir.mkdirs()) {
                          throw new IllegalStateException(
                              "Cannot create game profile directory"
                          );
                      }

                      File configFile = new File(configDir, "config.json");

                      if (!configFile.isFile()) {
                          ProfileModel profile = new ProfileModel(configDir);

                          profile.screenWidth = 320;
                          profile.screenHeight = 240;
                          profile.orientation = 3;
                          profile.showKeyboard = true;
                          profile.touchInput = true;
                          profile.forceFullscreen = true;

                          if (!ProfilesManager.saveConfig(profile)) {
                              throw new IllegalStateException(
                                  "Cannot create J2ME Loader game profile"
                              );
                          }
                      }

                      runOnUiThread(() -> {
                          status.setText("Starting Gish…");
                          Config.startApp(
                              MainActivity.this,
                              "Gish",
                              appDir.getAbsolutePath(),
                              false
                          );
                          finish();
                      });

                  } catch (Throwable error) {
                      android.util.Log.e(
                          "GishLauncher",
                          "Gish startup failed",
                          error
                      );

                      runOnUiThread(() ->
                          status.setText(
                              "Gish startup failed:\n" +
                              android.util.Log.getStackTraceString(error)
                          )
                      );
                  }
              }
          }
          '''

          target = root / 'src/main/java/ru/playsoftware/j2meloader/MainActivity.java'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(launcher, encoding='utf-8')

          print('Standalone Gish launcher prepared.')

          PY

      - name: Build standalone APK
        working-directory: runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleOpenDebug

      - name: Upload APK and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gish-Standalone-APK
          path: |
            runtime/app/build/outputs/apk/open/debug/*.apk
            runtime/app/build/reports/**
            runtime/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14


